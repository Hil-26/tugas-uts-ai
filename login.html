<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login | Sobat Alam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div class="card" style="padding: 40px; background: white; border-radius: 8px;">
        <h2>Login Sistem</h2>
        <p>Admin: admin/123 | User: user/123</p>
        <form id="login-form" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
            <input type="text" id="username" placeholder="Username" required style="padding: 10px;">
            <input type="password" id="password" placeholder="Password" required style="padding: 10px;">
            <button type="submit" class="btn-primary">Masuk</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
